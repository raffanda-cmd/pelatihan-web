<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Student API</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-white shadow-lg rounded-xl p-8 border border-gray-200">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-indigo-600">Login Sistem</h1>
        <p class="text-sm text-gray-500 mt-1">Silakan masukkan email dan password Anda.</p>
    </div>

    <!-- Form Login Email & Password -->
    <div class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input 
                type="email" 
                id="emailInput" 
                placeholder="budi@example.com" 
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
            >
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input 
                type="password" 
                id="passwordInput" 
                placeholder="••••••••" 
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
            >
        </div>

        <button 
            onclick="handleLogin()" 
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-md text-sm transition duration-200 shadow-md">
            Login
        </button>
    </div>

    <div id="errorMsg" class="mt-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-md hidden text-center"></div>
</div>

<script>
    
async function handleLogin() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();
    const errorBox = document.getElementById('errorMsg');

    errorBox.classList.add('hidden');

    if (!email || !password) {
        errorBox.textContent = "Email dan password wajib diisi!";
        errorBox.classList.remove('hidden');
        return;
    }

    try {
        const response = await fetch(
            'http://localhost:3000/api/v1/students/login',
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email,
                    password
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || 'Login gagal.');
        }

        // Ambil token dari dalam properti data
        const token = result.data?.token;

        if (!token) {
            throw new Error(
                'Login berhasil, tetapi token tidak ditemukan.'
            );
        }

        // Simpan token JWT
        localStorage.setItem('authToken', token);

        // Pastikan token berhasil disimpan
        if (!localStorage.getItem('authToken')) {
            throw new Error('Token gagal disimpan.');
        }

        // Arahkan ke halaman utama
        window.location.href = 'index.html';

    } catch (error) {
        errorBox.textContent = error.message;
        errorBox.classList.remove('hidden');

        console.error('Login Error:', error);
    }
}

</script>

</body>

</html>
